name: Deploy to GitHub Pages

# 대표님 컨펌용 배포. main 에 푸시하면 haddscience.github.io 에 반영된다.
# 실도메인(haddscience.com)은 Synology 로 별도 배포한다 — deploy/README.md 참고.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # 자동 번역 결과를 되커밋하므로 쓰기가 필요하다.
  contents: write
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 실행을 취소하지는 않는다(중간 상태로 남지 않도록).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # package.json 의 packageManager 필드를 corepack 이 그대로 따른다.
      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # 관리자 페이지는 브라우저에서 도는 정적 화면이라 API 키를 둘 곳이 없다.
      # 원문만 커밋되면 영문은 여기서 채운다. 키가 없으면 스크립트가 조용히 넘어간다.
      #
      # GITHUB_TOKEN 으로 미는 커밋은 워크플로를 다시 트리거하지 않는다(설계상).
      # 그래서 무한 루프가 생기지 않고, 대신 이 실행 안에서 곧바로 빌드까지 이어간다.
      # 번역이 실패해도 배포는 계속한다. 영문이 하루 늦게 붙는 것보다
      # 사이트가 안 올라가는 쪽이 훨씬 나쁘다.
      - name: 기사 자동 번역
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/translate-posts.mjs

      - name: 번역 결과 커밋
        continue-on-error: true
        run: |
          if [ -z "$(git status --porcelain content/data/news)" ]; then
            echo "번역 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/data/news
          git commit -m "기사 영문 번역 자동 생성"
          git push

      # next build + scripts/postbuild.mjs (.nojekyll, 루트 index.html 생성)
      # DEPLOY_TARGET=pages 면 postbuild 가 색인을 차단한다. 컨펌용 사이트가
      # 실도메인과 중복 콘텐츠로 검색에 경쟁하는 것을 막기 위한 것이다.
      - run: pnpm build
        env:
          DEPLOY_TARGET: pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
